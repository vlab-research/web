<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- D1. Motif M1, cell lattice. The nav mark, squared onto an ink tile - the same
       lock-up the footer already uses (ink band, on-invert lattice, DESIGN.md 8).
       Nine cells, five at target. Cell 8, gap 2, block 28, margin 2, so at 16px every
       cell is exactly 4 device px and every gap exactly 1. Colours: invert 1F272E,
       on-invert EDF1F2. Under-target cells are the same on-invert at reduced opacity,
       which is what assets/mark.svg does; no second hue is introduced. -->
  <rect width="32" height="32" rx="2" fill="#1F272E"/>
  <g fill="#EDF1F2">
    <rect x="2"  y="2"  width="8" height="8"/>
    <rect x="12" y="2"  width="8" height="8"/>
    <rect x="22" y="2"  width="8" height="8" fill-opacity=".34"/>
    <rect x="2"  y="12" width="8" height="8"/>
    <rect x="12" y="12" width="8" height="8" fill-opacity=".34"/>
    <rect x="22" y="12" width="8" height="8"/>
    <rect x="2"  y="22" width="8" height="8" fill-opacity=".34"/>
    <rect x="12" y="22" width="8" height="8"/>
    <rect x="22" y="22" width="8" height="8" fill-opacity=".34"/>
  </g>
</svg>
