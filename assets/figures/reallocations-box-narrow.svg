<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 202" width="100%"
     class="fig-realloc narrow" role="img" aria-labelledby="reallocTitle reallocDesc"
     preserveAspectRatio="xMinYMin meet" data-claim-unit="">
  <title id="reallocTitle">Budget reallocations per study</title>
  <desc id="reallocDesc">Budget reallocations per study, across 109 studies. The median study takes 61. The middle half of studies fall between 28 and 165. The tenth percentile is 13 and the ninetieth is 351, read against a scale running from 0 to 400 reallocations; the longest study ran to 1,308. This is a distribution across studies, not an uncertainty interval on an estimate.</desc>

  <style>
    /* Local roles, resolved from DESIGN.md sec 3 tokens only. No literal colour. */
    .fig-realloc{
      --realloc-data:  var(--data);
      --realloc-label: var(--ink);
      --realloc-rule:  var(--rule);
      --realloc-axis:  var(--ink-3);
      --realloc-src:   var(--ink-3);
    }
    /* On an ink band. --data reads 2.10:1 and --ink-3 reads 4.00:1 there; see sec 3. */
    .fig-realloc.inv{
      --realloc-data:  var(--data-inv);
      --realloc-label: var(--on-invert);
      --realloc-rule:  var(--rule-invert);
      --realloc-axis:  var(--on-invert-2);
      --realloc-src:   var(--on-invert-2);
    }
    .fig-realloc .box    { fill: var(--realloc-data); fill-opacity:.26;
                        stroke: var(--realloc-data); stroke-width:1 }
    .fig-realloc .cell   { fill: var(--realloc-data) }
    .fig-realloc .whisk  { stroke: var(--realloc-data); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-realloc .rule   { stroke: var(--realloc-rule); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-realloc .axis   { stroke: var(--realloc-axis); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-realloc .lab{
      font:600 13px/1 "Source Sans 3","Helvetica Neue",Arial,sans-serif;
      fill: var(--realloc-label);
    }
    .fig-realloc .num{
      font:400 15px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:-.01em;
      fill: var(--realloc-data); text-anchor:middle;
    }
    .fig-realloc .qnum{
      font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums;
      fill: var(--realloc-data); text-anchor:middle;
    }
    .fig-realloc .tik{
      font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:.11em;
      text-transform:uppercase; fill: var(--realloc-axis);
    }
    .fig-realloc .src{
      font:italic 400 12px/1 "Source Serif 4",Georgia,serif;
      fill: var(--realloc-src);
    }
  </style>

  <text class="lab" x="0" y="14">Budget reallocations</text>
  <text class="lab" x="0" y="30">per study</text>

  <!-- The values, above the interval they mark. C-089. -->
  <g data-claim="C-089">
    <text class="qnum" x="32.8" y="48">28</text>
    <text class="num"  x="71.4" y="48">61</text>
    <text class="qnum" x="193.0" y="48">165</text>
  </g>

  <!-- M3 interval. Bracket, bar, cell: three of the four primitives. -->
  <line class="whisk" x1="15.2" y1="68.0" x2="32.8" y2="68.0"/>
  <line class="whisk" x1="193.0" y1="68.0" x2="410.7" y2="68.0"/>
  <line class="whisk" x1="15.2" y1="59.0" x2="15.2" y2="77.0"/>
  <line class="whisk" x1="410.7" y1="59.0" x2="410.7" y2="77.0"/>
  <rect class="box" x="32.8" y="56.0" width="160.3" height="24.0"/>
  <rect class="cell" x="65.4" y="62.0" width="12.0" height="12.0"/>

  <!-- M4 tick rule: the scale the interval is read against -->
  <line class="axis" x1="0.0" y1="92.0" x2="468.0" y2="92.0"/>
  <line class="axis" x1="0.0" y1="92.0" x2="0.0" y2="99.0"/>
  <line class="axis" x1="117.0" y1="92.0" x2="117.0" y2="96.0"/>
  <line class="axis" x1="234.0" y1="92.0" x2="234.0" y2="99.0"/>
  <line class="axis" x1="351.0" y1="92.0" x2="351.0" y2="96.0"/>
  <line class="axis" x1="468.0" y1="92.0" x2="468.0" y2="99.0"/>
  <text class="tik" x="0.0" y="112" data-claim="none">0</text>
  <text class="tik" x="234.0" y="112" text-anchor="middle" data-claim="none">200</text>
  <text class="tik" x="468.0" y="112" text-anchor="end" data-claim="none">400 REALLOCATIONS</text>

  <line class="rule" x1="0" y1="126" x2="480" y2="126"/>

  <!-- Provenance rule, DESIGN.md sec 2. Mandatory, same visual unit as the figure. -->
  <text class="src" x="0" y="144" data-claim-source="">Distribution across 109 studies, each counted once. Box: 25th to 75th</text>
  <text class="src" x="0" y="160" data-claim-source="">percentile. Whiskers: 10th (13) to 90th (351); the longest ran to 1,308.</text>
  <text class="src" x="0" y="176" data-claim-source="">One reallocation is one pass over every stratum, resetting each budget from what</text>
  <text class="src" x="0" y="192" data-claim-source="">the stratum currently costs and how far it is from its target share.</text>
</svg>
