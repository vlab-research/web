<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 202" width="100%"
     class="fig-cost narrow" role="img" aria-labelledby="costTitle costDesc"
     preserveAspectRatio="xMinYMin meet" data-claim-unit="">
  <title id="costTitle">Respondents recruited per study on an active day</title>
  <desc id="costDesc">Advertising cost per respondent newly recruited, across 44 studies. The median study pays $1.05. The middle half fall between $0.29 and $1.57. The tenth percentile is $0.09 and the ninetieth $3.67, read against a scale from $0 to $4. The full range runs $0.04 to $8.89. Advertising spend only. This is a distribution across studies, not an uncertainty interval on an estimate.</desc>

  <style>
    /* Local roles, resolved from DESIGN.md sec 3 tokens only. No literal colour. */
    .fig-cost{
      --cost-data:  var(--data);
      --cost-label: var(--ink);
      --cost-rule:  var(--rule);
      --cost-axis:  var(--ink-3);
      --cost-src:   var(--ink-3);
    }
    /* On an ink band. --data reads 2.10:1 and --ink-3 reads 4.00:1 there; see sec 3. */
    .fig-cost.inv{
      --cost-data:  var(--data-inv);
      --cost-label: var(--on-invert);
      --cost-rule:  var(--rule-invert);
      --cost-axis:  var(--on-invert-2);
      --cost-src:   var(--on-invert-2);
    }
    .fig-cost .box    { fill: var(--cost-data); fill-opacity:.26;
                        stroke: var(--cost-data); stroke-width:1 }
    .fig-cost .cell   { fill: var(--cost-data) }
    .fig-cost .whisk  { stroke: var(--cost-data); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-cost .rule   { stroke: var(--cost-rule); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-cost .axis   { stroke: var(--cost-axis); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-cost .lab{
      font:600 13px/1 "Source Sans 3","Helvetica Neue",Arial,sans-serif;
      fill: var(--cost-label);
    }
    .fig-cost .num{
      font:400 15px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:-.01em;
      fill: var(--cost-data); text-anchor:middle;
    }
    .fig-cost .qnum{
      font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums;
      fill: var(--cost-data); text-anchor:middle;
    }
    .fig-cost .tik{
      font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:.11em;
      text-transform:uppercase; fill: var(--cost-axis);
    }
    .fig-cost .src{
      font:italic 400 12px/1 "Source Serif 4",Georgia,serif;
      fill: var(--cost-src);
    }
  </style>

  <text class="lab" x="0" y="14">Advertising cost</text>
  <text class="lab" x="0" y="30">per respondent</text>

  <!-- The values, above the interval they mark. C-091. -->
  <g data-claim="C-091">
    <text class="qnum" x="33.9" y="48">$0.29</text>
    <text class="num"  x="122.9" y="48">$1.05</text>
    <text class="qnum" x="183.7" y="48">$1.57</text>
  </g>

  <!-- M3 interval. Bracket, bar, cell: three of the four primitives. -->
  <line class="whisk" x1="10.5" y1="68.0" x2="33.9" y2="68.0"/>
  <line class="whisk" x1="183.7" y1="68.0" x2="429.4" y2="68.0"/>
  <line class="whisk" x1="10.5" y1="59.0" x2="10.5" y2="77.0"/>
  <line class="whisk" x1="429.4" y1="59.0" x2="429.4" y2="77.0"/>
  <rect class="box" x="33.9" y="56.0" width="149.8" height="24.0"/>
  <rect class="cell" x="116.9" y="62.0" width="12.0" height="12.0"/>

  <!-- M4 tick rule: the scale the interval is read against -->
  <line class="axis" x1="0.0" y1="92.0" x2="468.0" y2="92.0"/>
  <line class="axis" x1="0.0" y1="92.0" x2="0.0" y2="99.0"/>
  <line class="axis" x1="58.5" y1="92.0" x2="58.5" y2="96.0"/>
  <line class="axis" x1="117.0" y1="92.0" x2="117.0" y2="96.0"/>
  <line class="axis" x1="175.5" y1="92.0" x2="175.5" y2="96.0"/>
  <line class="axis" x1="234.0" y1="92.0" x2="234.0" y2="99.0"/>
  <line class="axis" x1="292.5" y1="92.0" x2="292.5" y2="96.0"/>
  <line class="axis" x1="351.0" y1="92.0" x2="351.0" y2="96.0"/>
  <line class="axis" x1="409.5" y1="92.0" x2="409.5" y2="96.0"/>
  <line class="axis" x1="468.0" y1="92.0" x2="468.0" y2="99.0"/>
  <text class="tik" x="0.0" y="112" data-claim="none">$0</text>
  <text class="tik" x="234.0" y="112" text-anchor="middle" data-claim="none">$2</text>
  <text class="tik" x="468.0" y="112" text-anchor="end" data-claim="none">$4 PER RESPONDENT</text>

  <line class="rule" x1="0" y1="126" x2="480" y2="126"/>

  <!-- Provenance rule, DESIGN.md sec 2. Mandatory, same visual unit as the figure. -->
  <text class="src" x="0" y="144" data-claim-source="">Advertising spend only — not the incentive, not the survey platform, not our</text>
  <text class="src" x="0" y="160" data-claim-source="">fee. Distribution across 44 studies. Box: 25th to 75th percentile. Whiskers:</text>
  <text class="src" x="0" y="176" data-claim-source="">10th ($0.09) to 90th ($3.67); the range runs $0.04 to $8.89.</text>
  <text class="src" x="0" y="192" data-claim-source="">Per respondent newly recruited, $166,243 over 163,555 respondents.</text>
</svg>
