<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 202" width="100%"
     class="fig-thru narrow" role="img" aria-labelledby="thruTitle thruDesc"
     preserveAspectRatio="xMinYMin meet" data-claim-unit="">
  <title id="thruTitle">Respondents recruited per study on an active day</title>
  <desc id="thruDesc">Respondents recruited per study on a day of active recruitment, across 129 studies. The median study recruits 140 on such a day. The middle half of studies fall between 69 and 300. The tenth percentile is 41 and the ninetieth is 531, read against a scale running from 0 to 550 respondents. This is a distribution across studies, not an uncertainty interval on an estimate.</desc>

  <style>
    /* Local roles, resolved from DESIGN.md sec 3 tokens only. No literal colour. */
    .fig-thru{
      --thru-data:  var(--data);
      --thru-label: var(--ink);
      --thru-rule:  var(--rule);
      --thru-axis:  var(--ink-3);
      --thru-src:   var(--ink-3);
    }
    /* On an ink band. --data reads 2.10:1 and --ink-3 reads 4.00:1 there; see sec 3. */
    .fig-thru.inv{
      --thru-data:  var(--data-inv);
      --thru-label: var(--on-invert);
      --thru-rule:  var(--rule-invert);
      --thru-axis:  var(--on-invert-2);
      --thru-src:   var(--on-invert-2);
    }
    .fig-thru .box    { fill: var(--thru-data); fill-opacity:.26;
                        stroke: var(--thru-data); stroke-width:1 }
    .fig-thru .cell   { fill: var(--thru-data) }
    .fig-thru .whisk  { stroke: var(--thru-data); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-thru .rule   { stroke: var(--thru-rule); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-thru .axis   { stroke: var(--thru-axis); stroke-width:1;
                        shape-rendering:crispEdges }
    .fig-thru .lab{
      font:600 13px/1 "Source Sans 3","Helvetica Neue",Arial,sans-serif;
      fill: var(--thru-label);
    }
    .fig-thru .num{
      font:400 15px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:-.01em;
      fill: var(--thru-data); text-anchor:middle;
    }
    .fig-thru .qnum{
      font:400 12px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums;
      fill: var(--thru-data); text-anchor:middle;
    }
    .fig-thru .tik{
      font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
      font-variant-numeric: tabular-nums; letter-spacing:.11em;
      text-transform:uppercase; fill: var(--thru-axis);
    }
    .fig-thru .src{
      font:italic 400 12px/1 "Source Serif 4",Georgia,serif;
      fill: var(--thru-src);
    }
  </style>

  <text class="lab" x="0" y="14">Respondents recruited</text>
  <text class="lab" x="0" y="30">per active day</text>

  <!-- The values, above the interval they mark. C-089. -->
  <g data-claim="C-089">
    <text class="qnum" x="58.7" y="48">69</text>
    <text class="num"  x="119.1" y="48">140</text>
    <text class="qnum" x="255.3" y="48">300</text>
  </g>

  <!-- M3 interval. Bracket, bar, cell: three of the four primitives. -->
  <line class="whisk" x1="34.9" y1="68.0" x2="58.7" y2="68.0"/>
  <line class="whisk" x1="255.3" y1="68.0" x2="451.8" y2="68.0"/>
  <line class="whisk" x1="34.9" y1="59.0" x2="34.9" y2="77.0"/>
  <line class="whisk" x1="451.8" y1="59.0" x2="451.8" y2="77.0"/>
  <rect class="box" x="58.7" y="56.0" width="196.6" height="24.0"/>
  <rect class="cell" x="113.1" y="62.0" width="12.0" height="12.0"/>

  <!-- M4 tick rule: the scale the interval is read against -->
  <line class="axis" x1="0.0" y1="92.0" x2="468.0" y2="92.0"/>
  <line class="axis" x1="0.0" y1="92.0" x2="0.0" y2="99.0"/>
  <line class="axis" x1="85.1" y1="92.0" x2="85.1" y2="96.0"/>
  <line class="axis" x1="170.2" y1="92.0" x2="170.2" y2="96.0"/>
  <line class="axis" x1="255.3" y1="92.0" x2="255.3" y2="96.0"/>
  <line class="axis" x1="340.4" y1="92.0" x2="340.4" y2="96.0"/>
  <line class="axis" x1="425.5" y1="92.0" x2="425.5" y2="99.0"/>
  <text class="tik" x="0.0" y="112" data-claim="none">0</text>
  <text class="tik" x="212.7" y="112" text-anchor="middle" data-claim="none">250</text>
  <text class="tik" x="468.0" y="112" text-anchor="end" data-claim="none">500 RESPONDENTS</text>

  <line class="rule" x1="0" y1="126" x2="480" y2="126"/>

  <!-- Provenance rule, DESIGN.md sec 2. Mandatory, same visual unit as the figure. -->
  <text class="src" x="0" y="144" data-claim-source="">Distribution across 129 studies, each at its own median active day. Box: 25th to</text>
  <text class="src" x="0" y="160" data-claim-source="">75th percentile. Whiskers: 10th (41) to 90th (531).</text>
  <text class="src" x="0" y="176" data-claim-source="">An active day is a study-day recruiting at least 20 respondents; half of studies</text>
  <text class="src" x="0" y="192" data-claim-source="">have 11 or more.</text>
</svg>
