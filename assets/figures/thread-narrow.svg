<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 372" width="100%"
     class="thread narrow" role="img" aria-labelledby="thrTitleN thrDescN">
  <title id="thrTitleN">A questionnaire running as a conversation</title>
  <desc id="thrDescN">A survey asks a question inside a chat thread. The choices arrive as a
    numbered list and the respondent replies with a number. A dashed rule marks a pause of
    months, after which the same thread reopens and asks again.</desc>

  <!--
    M5, the narrow variant. Same drawing, same words, a viewBox that is already narrow.
    The wide one is 460 units and its type is set at absolute sizes, so on a phone it
    either scrolled sideways or put its 13px label at 9px; the respondent's replies sit
    at the RIGHT edge, which is exactly what the sideways scroll hid. A thread whose
    outgoing bubbles are off-screen is not a thread. Below 640px CSS shows this instead.

    Everything else is the wide file, unchanged: the styles are the same tokens, the
    bubbles the same geometry, the numerals the same list indices carrying
    data-claim="none". Read the wide file's note for the reasoning; it governs both.
    Any edit to the words here must be made there too.
  -->
  <style>
    .thread .inb  { fill:var(--sunk) }
    .thread .outb { fill:var(--ink) }
    .thread .int  { font:400 13px/1.4 "Source Sans 3","Helvetica Neue",Arial,sans-serif;
                    fill:var(--ink) }
    .thread .outt { font:400 13px/1.4 "Source Sans 3","Helvetica Neue",Arial,sans-serif;
                    fill:var(--paper) }
    .thread .idx  { font:500 12px "IBM Plex Mono",ui-monospace,monospace;
                    fill:var(--ink-3); font-variant-numeric:tabular-nums }
    .thread .gap  { stroke:var(--rule-2); stroke-width:1; stroke-dasharray:4 4;
                    shape-rendering:crispEdges }
    .thread .glab { font:500 10px "IBM Plex Mono",ui-monospace,monospace;
                    letter-spacing:.14em; fill:var(--ink-3) }
    /* On an ink band the tokens above would collapse to near-invisible. */
    .thread.inv .inb  { fill:var(--rule-invert) }
    .thread.inv .int  { fill:var(--on-invert) }
    .thread.inv .outb { fill:var(--on-invert) }
    .thread.inv .outt { fill:var(--invert) }
    .thread.inv .idx,
    .thread.inv .glab { fill:var(--on-invert-2) }
    .thread.inv .gap  { stroke:var(--rule-invert) }
  </style>

  <rect class="inb" x="0" y="0" width="252" height="34" rx="17"/>
  <text class="int" x="18" y="21">How often do you use a mobile phone?</text>

  <rect class="inb" x="0" y="42" width="190" height="86" rx="17"/>
  <text class="idx" x="18" y="66"  data-claim="none">1</text>
  <text class="int" x="42" y="66">Every day</text>
  <text class="idx" x="18" y="90"  data-claim="none">2</text>
  <text class="int" x="42" y="90">A few times a week</text>
  <text class="idx" x="18" y="114" data-claim="none">3</text>
  <text class="int" x="42" y="114">Rarely or never</text>

  <rect class="outb" x="272" y="140" width="68" height="34" rx="17"/>
  <text class="outt" x="301" y="161" data-claim="none">2</text>

  <line class="gap" x1="0" y1="212" x2="114" y2="212"/>
  <text class="glab" x="126" y="216">MONTHS LATER</text>
  <line class="gap" x1="227" y1="212" x2="340" y2="212"/>

  <rect class="inb" x="0" y="244" width="246" height="34" rx="17"/>
  <text class="int" x="18" y="265">Welcome back. A few more questions.</text>

  <rect class="inb" x="0" y="286" width="248" height="34" rx="17"/>
  <text class="int" x="18" y="307">Has that changed since we last spoke?</text>

  <rect class="outb" x="250" y="328" width="90" height="34" rx="17"/>
  <text class="outt" x="279" y="349">Yes</text>
</svg>
